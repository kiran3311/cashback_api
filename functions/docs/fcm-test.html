<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FCM Push Notification Test</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 720px;
      margin: 32px auto;
      padding: 0 16px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: 600;
    }

    input,
    textarea,
    button {
      box-sizing: border-box;
      font: inherit;
      padding: 9px;
      width: 100%;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      margin-top: 16px;
    }

    #status {
      background: #f3f4f6;
      border-radius: 6px;
      min-height: 70px;
      padding: 12px;
      white-space: pre-wrap;
    }

    .hint {
      color: #4b5563;
      font-size: .9rem;
    }
  </style>
</head>

<body>
  <h1>FCM Push Notification Test</h1>
  <p class="hint">Replace the Firebase configuration and VAPID key in this file before testing.</p>

  <label for="apiUrl">API URL</label>
  <input id="apiUrl" value="http://localhost:5001" />

  <label for="userId">User ID</label>
  <input id="userId" placeholder="Firestore user document ID" />

  <button id="getTokenButton">1. Generate and save FCM token</button>

  <label for="title">Notification title</label>
  <input id="title" value="Cashback received" />

  <label for="body">Notification body</label>
  <input id="body" value="You received Rs. 20 cashback." />

  <label for="data">Notification data (valid JSON, optional)</label>
  <textarea id="data">{
  "type": "CASHBACK_RECEIVED",
  "cashbackId": "cashback_001"
}</textarea>

  <button id="sendButton">2. Send test notification</button>

  <h3>Status</h3>
  <div id="status">Ready.</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

    // Firebase Console -> Project settings -> Your apps -> Web app.
    // Do NOT put Firebase Admin service-account credentials in this file.

  
    const firebaseConfig = {

  apiKey: "AIzaSyAMEWynVhQNJWZ2ShaoIDfqilXeQYDzjTM",

  authDomain: "my-cashback-app.firebaseapp.com",

  projectId: "my-cashback-app",

  storageBucket: "my-cashback-app.firebasestorage.app",

  messagingSenderId: "399331789129",

  appId: "1:399331789129:web:36ec7b99d2d23a6f397298",

  measurementId: "G-X0E38Y09TR"

};



    // Firebase Console -> Project settings -> Cloud Messaging -> Web Push certificates.
    const vapidKey = "BOYUdmPp6TL4kAoiElDm-W7ewinqZVU_syJjx_7HtviQax2hKFTYOwX07Y-F1oot3Gywbe08QP0DX6hjbEBM18k";

    const status = document.querySelector("#status");
    const showStatus = (value) => status.textContent = value;
    const value = (selector) => document.querySelector(selector).value.trim();
    const app = initializeApp(firebaseConfig);
    const messaging = getMessaging(app);

    // A message received while this page is open is handled here.
    onMessage(messaging, (payload) => {
      console.log("Foreground FCM message:", payload);
      showStatus(`Notification received while page is open:\n${JSON.stringify(payload, null, 2)}`);
    });

    document.querySelector("#getTokenButton").addEventListener("click", async () => {
      const userId = value("#userId");
      if (!userId) return showStatus("Enter a User ID first.");

      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          return showStatus("Notification permission was not granted.");
        }

        const registration = await navigator.serviceWorker.register("./firebase-messaging-sw.js");
        const fcmToken = await getToken(messaging, { vapidKey, serviceWorkerRegistration: registration });
        if (!fcmToken) return showStatus("Firebase did not return an FCM token.");

        const response = await fetch(`${value("#apiUrl")}/save-fcm-token`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, fcmToken })
        });
        const result = await response.json();
        showStatus(`FCM token generated and save API returned ${response.status}:\n${JSON.stringify(result, null, 2)}\n\nToken:\n${fcmToken}`);
      } catch (error) {
        console.error(error);
        showStatus(`Could not generate/save FCM token:\n${error.message}`);
      }
    });

    document.querySelector("#sendButton").addEventListener("click", async () => {
      const userId = value("#userId");
      const title = value("#title");
      const body = value("#body");
      if (!userId || !title || !body) return showStatus("User ID, title, and body are required.");

      try {
        const dataText = value("#data");
        const data = dataText ? JSON.parse(dataText) : {};
        const response = await fetch(`${value("#apiUrl")}/send-push-notification`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, title, body, data })
        });
        const result = await response.json();
        showStatus(`Send API returned ${response.status}:\n${JSON.stringify(result, null, 2)}`);
      } catch (error) {
        console.error(error);
        showStatus(`Could not send notification:\n${error.message}`);
      }
    });
  </script>
</body>

</html>
